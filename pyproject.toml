[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lao"
version = "1.1.0"
description = "Reference implementation of Leaf-Abscission Optimization and threshold-based selection."
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.3.5",
  "scipy==1.15.2",
  "numba==0.64.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
full = [
  "cma==4.4.4",
  "pytest==8.4.2",
]
test = ["pytest==8.4.2", "cma==4.4.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
