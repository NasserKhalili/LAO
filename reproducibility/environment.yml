# Minimal recorded environment for the public LAO implementation.
# The complete experimental result set is not shipped with this repository.
name: lao
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - pip:
      - numpy==2.3.5
      - scipy==1.15.2
      - numba==0.64.0
      - PyYAML==6.0.3
      - cma==4.4.4
      - pytest==8.4.2
